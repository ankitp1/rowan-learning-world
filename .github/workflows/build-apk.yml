name: Build Chromecast / Android TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies & build web bundle
        run: |
          npm ci
          npm run build
          mkdir -p android-tv/app/src/main/assets
          cp -R dist/* android-tv/app/src/main/assets/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android TV APK
        working-directory: android-tv
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../rowan-learning-world-tv.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rowan-learning-world-tv-apk
          path: rowan-learning-world-tv.apk

      - name: Publish APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-tv
          name: "Rowan's Learning World — Chromecast / Android TV APK"
          body: |
            Sideloadable APK for **Chromecast with Google TV** and Android TV devices.
            - Supports full Chromecast Remote navigation (D-pad arrows, Select button, and Back button).
            - Syncs progress in real time across TV, phone, laptop, and iPad via Cloud Firestore.
          files: rowan-learning-world-tv.apk
          prerelease: false
